   the path a third time. A camera fed by an approximation of the movement
   can always frame something the renderer didn't actually draw, so there
   is now exactly one function and everything consumes its real output.

   The curves themselves are unchanged from the live (eased) versions —
   this is a de-duplication, not a re-design of the animation.
*/
function pieceTrajectory(type, start, end, t){
  const s = LOGICAL_SIZE/8;
  // The king's original curve eases differently (and deliberately stops
  // slightly short via t*0.9) — preserved exactly.
  const e = (type === 'k') ? easeInOutCubic(t*0.9) : easeOutCubic(t);
  const bob = 1 - Math.abs(0.5 - e);
  if(type === 'n'){
    const mid = { x: (start.x+end.x)/2, y: (start.y+end.y)/2 - Math.max(s*0.5, Math.hypot(end.x-start.x, end.y-start.y)*0.28) };
    const p = quadBezier(start, mid, end, e);
    return {x:p.x, y:p.y, angle: Math.PI*(e*1.2), scale: 1 + 0.06*bob, e};
  }
  if(type === 'b'){
    const ctrl = { x: (start.x+end.x)/2 + (end.y-start.y)*0.18, y: (start.y+end.y)/2 + (start.x-end.x)*0.18 };
    const p = quadBezier(start, ctrl, end, e);
    return {x:p.x, y:p.y, angle: (e-0.5)*0.18, scale: 1, e};
  }
  if(type === 'r'){
    const bounce = (t > 0.85) ? (1 + (1 - (t-0.85)/0.15)*0.08) : 1;
    return {x: start.x + (end.x-start.x)*e, y: start.y + (end.y-start.y)*e, angle: 0, scale: bounce, e};
  }
  if(type === 'q'){
    const ctrl1 = { x: start.x + (end.x-start.x)*0.33 - (end.y-start.y)*0.12, y: start.y + (end.y-start.y)*0.33 + (end.x-start.x)*0.06 };
    const ctrl2 = { x: start.x + (end.x-start.x)*0.66 + (end.y-start.y)*0.12, y: start.y + (end.y-start.y)*0.66 - (end.x-start.x)*0.06 };
    const p = cubicBezier(start, ctrl1, ctrl2, end, e);
    return {x:p.x, y:p.y, angle: (e-0.5)*Math.PI*0.35, scale: 1 + 0.07*bob, e};
  }
  if(type === 'k'){
    return {x: start.x + (end.x-start.x)*e, y: start.y + (end.y-start.y)*e - 4*bob, angle: (e-0.5)*0.08, scale: 1 + 0.03*bob, e};
  }
  return {x: start.x + (end.x-start.x)*e, y: start.y + (end.y-start.y)*e - 6*bob, angle: 0, scale: 1 + 0.04*bob, e};
}

// Per-type decorative flourish drawn behind/under the moving piece on the
// LIVE overlay only (glows, the knight's ground shadow, the queen's flash).
// Purely cosmetic and unchanged from the original per-piece functions —
// kept out of pieceTrajectory() so position/scale/angle stay the single
// shared truth that the export and the camera can rely on.
function drawLiveDecoration(type, start, end, st, t){
  const s = LOGICAL_SIZE/8, e = st.e;
  function withView(fn){
    octx.save();
    octx.translate(viewTransform.panX, viewTransform.panY);
    octx.scale(viewTransform.scale, viewTransform.scale);
    fn();
    octx.restore();
  }
  if(type === 'n'){
    withView(()=>{ octx.beginPath(); octx.fillStyle = `rgba(0,0,0,${0.14*(1-e)})`; octx.ellipse(st.x, st.y + 24*(1-e), s*0.25, s*0.12*(1-e), 0, 0, Math.PI*2); octx.fill(); });
  } else if(type === 'b'){
    withView(()=>{ octx.beginPath(); octx.fillStyle = `rgba(180,220,255,${0.14*(1-e)})`; octx.arc(st.x, st.y, s*0.22, 0, Math.PI*2); octx.fill(); });
  } else if(type === 'r'){
    if(t > 0.7){ const p = (t-0.7)/0.3; withView(()=>{ octx.beginPath(); octx.fillStyle = `rgba(255,235,150,${0.25*(1-p)})`; octx.arc(end.x, end.y, s*(0.1 + p*0.7), 0, Math.PI*2); octx.fill(); }); }
  } else if(type === 'q'){
    if(e > 0.45 && e < 0.65){ withView(()=>{ octx.beginPath(); octx.fillStyle = `rgba(255,230,120,${(0.65-e)*2})`; octx.arc(st.x, st.y, s*0.38*(0.65-e)*4, 0, Math.PI*2); octx.fill(); }); }
  } else if(type === 'k'){
    if(t > 0.8){ const g = (t-0.8)/0.2; withView(()=>{ octx.beginPath(); octx.fillStyle = `rgba(255,245,200,${0.18*(1-g)})`; octx.arc(end.x, end.y, s*0.45*g, 0, Math.PI*2); octx.fill(); }); }
  } else {
    withView(()=>{ octx.beginPath(); octx.fillStyle = `rgba(250,238,88,${0.45*e})`; octx.arc(end.x, end.y, s*(0.2 + 0.4*e), 0, Math.PI*2); octx.fill(); });
  }
}

// The live animation loop — one implementation for every piece type, since
// the only per-type differences are the trajectory (pieceTrajectory) and
// the cosmetic flourish (drawLiveDecoration). t0 is anchored to the first
// real rAF timestamp for the same reason the export does it: a callback
// delayed past `duration` would otherwise skip the whole animation.
function animPiece(type,start,end,img,duration,onComplete){
  let t0 = null;
  function frame(now){
    if(t0 === null) t0 = now;
    const t = Math.min(1, (now - t0)/duration);
    drawBoard(); redrawOverlay(t >= 1);
    octx.globalAlpha = 1;
    const st = pieceTrajectory(type, start, end, t);
    drawLiveDecoration(type, start, end, st, t);
    drawMovingImage(img, st.x, st.y, st.scale, st.angle, true);
    if(t < 1) requestAnimationFrame(frame);
    else { octx.clearRect(0,0,LOGICAL_SIZE,LOGICAL_SIZE); if(onComplete) onComplete(); }
  }
  requestAnimationFrame(frame);
}

/* ---------------- CONTROLS (Original + Status Updates) ---------------- */
// Undo/redo walk `moveHistory` via `historyPointer`, calling chess.js's own
// move()/undo() to keep the authoritative position in sync — no duplicate
// chess engine, no separate move-legality logic. syncTransientMoveState()
// keeps lastMoveRecord (and any in-flight animation hide-state) pointing at
// exactly the move that produced the CURRENT position, so a move that has
// been undone can never be replayed or exported as if it still applied.
// One ply backward / forward through the CURRENT history. Undo/Redo and the
// Prev/Next navigation buttons are the same operation on the same
// moveHistory/historyPointer — PGN navigation deliberately does not get a
// second, parallel history system. Both are safe no-ops at the ends.
function stepBackward(){
  if(historyPointer <= 0) return false; // already at the start position
  try{
    game.undo();
    historyPointer--;
    syncTransientMoveState();
    updateStatus(); drawBoard(); redrawOverlay(); updateHistory();
    return true;
  }catch(e){ return false; }
}
function stepForward(){
  if(historyPointer >= moveHistory.length) return false; // nothing ahead
  const rec = moveHistory[historyPointer];
  const moveObj = { from: rec.from, to: rec.to };
  if(rec.promotion) moveObj.promotion = rec.promotion;
  let m = null;
  try { m = game.move(moveObj); } catch(e){ m = null; }
  if(!m) return false;
  historyPointer++;
  syncTransientMoveState();
  updateStatus(); drawBoard(); redrawOverlay(); updateHistory();
  return true;
}
document.getElementById('undo').addEventListener('click', stepBackward);
document.getElementById('redo').addEventListener('click', stepForward);
document.getElementById('prevMove').addEventListener('click', stepBackward);
document.getElementById('nextMove').addEventListener('click', stepForward);
document.getElementById('reset').addEventListener('click', ()=>{ game.reset(); selectedSquare=null; moveHistory=[]; historyPointer=0; importedLimit=0; syncTransientMoveState(); updateStatus(); unzoomSmooth(); drawBoard(); redrawOverlay(); updateHistory(); });

/* ---------------- PGN IMPORT (Phase 6) ----------------
   Brings a real game in from Chess.com / Lichess / anywhere so the user
   doesn't have to rebuild positions by hand. Deliberately NOT an analysis
   feature: the PGN is only a source of moves. Nothing is evaluated,
   classified or looked up, and no engine is involved.

   chess.js stays the only chess authority — it parses the PGN and it
   validates every move. The moves it reports are then replayed through
   attemptMove(), the exact same entry point a dragged move uses, so every
   imported ply gets a normal move record (snapshots, castling/en-passant
   metadata, check square, empty annotation/arrows/highlights) and behaves
   identically to a hand-played move everywhere downstream — timeline,
   selection, preview, export.
*/

// Strips the parts of PGN that carry no moves: brace comments, rest-of-line
// comments, NAGs, and parenthesised variations (nesting-aware, so a
// variation inside a variation is removed with it). Variations are dropped
// rather than parsed — the mainline is what gets imported.
function sanitizePgnText(raw){
  let s = String(raw || '').replace(/\r/g, '');
  s = s.replace(/\{[^}]*\}/g, ' ');   // { comment }
  s = s.replace(/;[^\n]*/g, ' ');     // ; comment to end of line
  let out = '', depth = 0;
  for(const ch of s){
    if(ch === '('){ depth++; continue; }
    if(ch === ')'){ if(depth > 0) depth--; continue; }
    if(depth === 0) out += ch;
  }
  out = out.replace(/\$\d+/g, ' ');   // NAGs ($1, $4, ...)
  return out;
}

function importPgn(text){
  const statusEl = document.getElementById('pgnStatus');
  function fail(msg){
    if(statusEl) statusEl.textContent = msg;
    showMessage(msg, 'error');
    return false;
  }
  if(typeof Chess !== 'function') return fail('Chess engine not loaded yet.');
  const raw = String(text || '').trim();
  if(!raw) return fail('Paste a PGN first.');

  // Parse in a throwaway game so a bad PGN can never damage the live one.
  const probe = new Chess();
  let ok = false;
  try { ok = !!probe.load_pgn(sanitizePgnText(raw), {sloppy: true}); } catch(e){ ok = false; }
  if(!ok){ try { ok = !!probe.load_pgn(raw, {sloppy: true}); } catch(e){ ok = false; } }
  if(!ok) return fail('Could not read that PGN.');

  const moves = probe.history({verbose: true});
  if(!moves.length) return fail('That PGN contains no moves.');

  // A PGN may start from a set-up position rather than the initial one.
  const fenHeader = raw.match(/\[\s*FEN\s+"([^"]+)"\s*\]/i);

  let startedOk = true;
  if(fenHeader){ try { startedOk = !!game.load(fenHeader[1]); } catch(e){ startedOk = false; } }
  if(!fenHeader || !startedOk) game.reset();

  selectedSquare = null;
  moveHistory = [];
  historyPointer = 0;
  // Reset before replay: attemptMove() clamps importedLimit down to
  // moveHistory.length on every push (see attemptMove), so a stale limit
  // left over from a PREVIOUS import would otherwise cap this new one at 1.
  importedLimit = 0;

  let applied = 0;
  for(const mv of moves){
    if(!attemptMove(mv.from, mv.to, mv.promotion || null)) break;
    applied++;
  }

  if(!applied) return fail('Could not replay that PGN.');

  // attemptMove() (via the loop above) leaves `game` and `historyPointer`
  // at the LAST imported ply — necessary so buildMoveRecord() could snapshot
  // each position as it was built. But a fresh import should hand the user
  // the START of the game, not its end: rewind `game` back to the starting
  // position with the same game.undo() stepBackward() already uses, WITHOUT
  // touching moveHistory itself, so Next immediately plays Move 1 and every
  // ply is still there to step through (or click in the timeline).
  for(let i=0;i<applied;i++) game.undo();
  historyPointer = 0;
  // The whole imported line is immediately selectable/visible in the
  // timeline (see importedLimit above) even though historyPointer starts at
  // 0 - it's the definitive history, not an undone one.
  importedLimit = applied;

  syncTransientMoveState();
  updateStatus(); drawBoard(); redrawOverlay(); updateHistory();

  const msg = applied === moves.length
    ? `Imported ${applied} moves.`
    : `Imported ${applied} of ${moves.length} moves.`;
  if(statusEl) statusEl.textContent = msg + ' Press Next to start from Move 1.';
  showMessage(msg, 'success');
  return true;
}
document.getElementById('importPgn').addEventListener('click', ()=>{
  importPgn(document.getElementById('pgnInput').value);
});
document.getElementById('flip').addEventListener('click', ()=>{ boardFlipped = !boardFlipped; drawBoard(); redrawOverlay(); });
document.getElementById('captureFx').addEventListener('change', (e)=>{ captureEffect = e.target.value; });
// Play/Export operate on the ACTIVE record — the selected timeline move if
// one is selected, else the latest move (getActiveRecord()'s default) —
// so previewing/exporting an older move works exactly like the latest one.
document.getElementById('playAnim').addEventListener('click', ()=>{ const rec = getActiveRecord(); if(rec) playRecordAnimation(rec, ()=>{ updateHistory(); updateStatus(); }); });
document.getElementById('exportAnim').addEventListener('click', ()=>{ const rec = getActiveRecord(); if(!rec){ showMessage('Make a move first (drag a piece). Export records the selected move.', 'error'); return; } exportLastMoveAsWebM(rec, {fps: EXPORT_FPS}); });
const removeBtn = document.getElementById('removeToggle'); removeBtn.addEventListener('click', ()=>{ removeMode = !removeMode; removeBtn.classList.toggle('active', removeMode); removeBtn.textContent = removeMode ? 'Remove: ON' : 'Remove Piece'; });
document.getElementById('clearAll').addEventListener('click', ()=>{ const rec=getActiveRecord(); if(rec){ rec.arrows=[]; rec.highlights=[]; } redrawOverlay(); updateHistory(); });
document.getElementById('clearStoryTargets').addEventListener('click', ()=>{ const rec=getActiveRecord(); if(rec) rec.storyTargets=[]; redrawOverlay(); updateHistory(); });

// NEW (Phase 3): return the board/annotation context to the live position.
document.getElementById('backToLive').addEventListener('click', ()=>{ if(historyPointer > 0) selectMove(historyPointer); });

// NEW (Phase 3): annotation/badge are USER choices only — the app never
// computes, verifies, or suggests them. Written straight onto the active
// move record (never a global), so they never leak to another move.
document.getElementById('annotationSelect').addEventListener('change', (e)=>{
  const rec = getActiveRecord();
  if(!rec) return;
  rec.annotation = e.target.value;
  rec.badge = badgeForClassification(e.target.value); // symbol derived, never chosen separately
  updateTimeline();
  redrawOverlay();
});

/* ---------------- TIMELINE + ANNOTATION UI (Phase 3) ---------------- */
// Renders only the current active line (plies 1..historyPointer) as
// White/Black move pairs, PGN-table style. A move undone past historyPointer
// simply stops appearing here (and reappears on redo) — the list always
// mirrors the real current history, never a stale/duplicate copy of it.
function updateTimeline(){
  const el = document.getElementById('timelineList');
  if(!el) return;
  el.innerHTML = '';
  function moveLabel(rec){
    let label = rec.san || (rec.from + '-' + rec.to);
    if(rec.badge) label += ' ' + rec.badge;
    return label;
  }
  function makeMoveBtn(rec){
    const b = document.createElement('button');
    b.style.padding = '3px 8px';
    b.style.fontSize = '13px';
    b.textContent = moveLabel(rec);
    if(rec.ply === selectedPly) b.classList.add('active');
    b.title = rec.annotation ? `${moveLabel(rec)} — ${rec.annotation}` : moveLabel(rec);
    b.onclick = () => selectMove(rec.ply);
    return b;
  }
  // Shows the current active line (1..historyPointer) exactly as before for
  // a normally-played game, PLUS an imported PGN's full line up front (see
  // importedLimit above) — an imported line is the definitive history, not
  // an undone one, so it doesn't need to wait for Next to walk `game` up to
  // each ply before it can appear here.
  const visibleLimit = Math.max(historyPointer, importedLimit);
  for(let i=0; i<visibleLimit; i+=2){
    const whiteRec = moveHistory[i];
    // Bounds-check against visibleLimit, not just array length: after an
    // undo (with no imported future), moveHistory[i+1] can still exist
    // (it's kept around for redo) but no longer be part of the ACTIVE line
    // — it must not reappear here until the user actually redoes it.
    const blackRec = (i+1 < visibleLimit) ? moveHistory[i+1] : undefined;
    const row = document.createElement('div');
    row.style.cssText = 'padding:4px 6px;display:flex;gap:6px;align-items:center;border-bottom:1px solid rgba(255,255,255,0.03)';
    const numSpan = document.createElement('span');
    numSpan.className = 'small';
    numSpan.style.minWidth = '20px';
    numSpan.textContent = (Math.floor(i/2)+1) + '.';
    row.appendChild(numSpan);
    row.appendChild(makeMoveBtn(whiteRec));
    if(blackRec) row.appendChild(makeMoveBtn(blackRec));
    el.appendChild(row);
  }
}

/* ---------------- MOVE CLASSIFICATION (Phase 6) ----------------
   Annotation and Badge used to be two separate manual controls that the
   user had to keep in sync by hand ("Brilliant" *and* "!!"). They are one
   piece of data: the human's classification of the move, plus the
   conventional symbol that classification is written with. The user picks
   the classification once and the symbol follows automatically.

   The existing option names are kept as-is; "Interesting" is the only
   added label, because the existing list had no term for "!?". Good and
   Book are deliberately symbol-less — there is no conventional symbol for
   either, and inventing one would put a mark on the board the notation
   doesn't have.

   Nothing here is computed or suggested by the app: the user remains the
   only one who decides whether a move was brilliant or a blunder.
*/
const CLASSIFICATIONS = [
  { value: '',            badge: '',   label: '(none)' },
  { value: 'Brilliant',   badge: '!!', label: 'Brilliant  !!' },
  { value: 'Best',        badge: '!',  label: 'Best  !' },
  { value: 'Good',        badge: '',   label: 'Good' },
  { value: 'Book',        badge: '',   label: 'Book' },
  { value: 'Interesting', badge: '!?', label: 'Interesting  !?' },
  { value: 'Inaccuracy',  badge: '?!', label: 'Inaccuracy  ?!' },
  { value: 'Mistake',     badge: '?',  label: 'Mistake  ?' },
  { value: 'Blunder',     badge: '??', label: 'Blunder  ??' },
  { value: 'Check',       badge: '+',  label: 'Check  +' },
  { value: 'Checkmate',   badge: '#',  label: 'Checkmate  #' }
];
function badgeForClassification(value){
  const hit = CLASSIFICATIONS.find(c => c.value === value);
  return hit ? hit.badge : '';
}
function buildClassificationOptions(){
  const sel = document.getElementById('annotationSelect');
  if(!sel || sel.options.length) return;
  for(const c of CLASSIFICATIONS){
    const o = document.createElement('option');
    o.value = c.value; o.textContent = c.label;
    sel.appendChild(o);
  }
}

// Populates the "selected move" label and the classification select from
// the active record. Disabled (and cleared) when there's no move yet.
function updateAnnotationPanel(){
  const labelEl = document.getElementById('selectedMoveLabel');
  const annSel = document.getElementById('annotationSelect');
  const storyEl = document.getElementById('storyTargetList');
  if(!labelEl || !annSel) return;
  buildClassificationOptions();
  const rec = getActiveRecord();
  if(storyEl) storyEl.textContent = (rec && rec.storyTargets.length) ? rec.storyTargets.join(' ') : 'none';
  if(!rec){
    labelEl.textContent = 'No move selected';
    annSel.value = ''; annSel.disabled = true;
    return;
  }
  const moveNum = Math.ceil(rec.ply / 2);
  const side = rec.color === 'w' ? '.' : '...';
  const live = rec.ply === historyPointer ? ' (live)' : '';
  labelEl.textContent = `Move ${moveNum}${side} ${rec.san || rec.to}${live}`;
  annSel.disabled = false;
  annSel.value = rec.annotation || '';
}

/* history UI (Original, now move-scoped — Phase 3) */
function updateHistory(){
  updateTimeline();
  updateAnnotationPanel();
  const rec = getActiveRecord();
  const activeArrows = rec ? rec.arrows : [];
  const activeHighlights = rec ? rec.highlights : [];
  const el=document.getElementById('historyList'); el.innerHTML='';
  activeArrows.forEach((a,i)=>{ const d=document.createElement('div'); d.style.padding='6px'; d.style.borderBottom='1px solid rgba(255,255,255,0.03)'; d.innerHTML=`Arrow ${i+1}: ${a.from} → ${a.to} <button data-i='${i}' style="padding: 2px 5px; font-size: 10px; float: right;">X</button>`; el.appendChild(d); });
  activeHighlights.forEach((h,i)=>{ const d=document.createElement('div'); d.style.padding='6px'; d.style.borderBottom='1px solid rgba(255,255,255,0.03)'; d.innerHTML=`Highlight ${i+1}: ${h.sq} <button data-i='h${i}' style="padding: 2px 5px; font-size: 10px; float: right;">X</button>`; el.appendChild(d); });
  el.querySelectorAll('button').forEach(b=>{ b.onclick=()=>{ const id=b.dataset.i; const rec2=getActiveRecord(); if(!rec2) return; if(id.startsWith('h')){ rec2.highlights.splice(parseInt(id.slice(1)),1); } else { rec2.arrows.splice(parseInt(id),1); } redrawOverlay(); updateHistory(); }; });

/* ---------------- ZOOM helpers (MODIFIED for Pan/Zoom) ---------------- */
function zoomToSquareSmooth(sq){
  const displayPx = boardHolder.clientWidth;
  const c = squareCenter(sq); // Logical (0..LOGICAL_SIZE) coords — already flip-aware

  // COORDINATE-SPACE FIX: viewTransform.panX/panY are CSS/display-pixel
  // offsets (they're applied directly as `canvasWrap.style.transform:
  // translate(...)px`, exactly like pinch-zoom's onMove handler computes
  // them), but squareCenter() returns coordinates in the canvas's internal
  // LOGICAL_SIZE (600x600) bitmap space. Those two spaces only coincide
  // when the board happens to render at exactly 600 CSS px. Convert the
  // logical square-center into display-pixel space (at scale=1) first, the
  // same way the canvas's own CSS width/height already scales its bitmap,
  // so this works at any board size — matching pinch-zoom's convention.
  const dispScale = displayPx / LOGICAL_SIZE;
  const cDisplayX = c.x * dispScale;
  const cDisplayY = c.y * dispScale;

  let scale = 2.5; // Target scale (unchanged)

  // SECOND COORDINATE FIX: .canvas-wrap has `transform-origin:center center`
  // (see <style>), so `transform: translate(panX,panY) scale(s)` scales
  // around the element's own center O=(displayPx/2, displayPx/2), not its
  // top-left corner — a local point P lands on screen at
  // `O + scale*(P-O) + (panX,panY)`. Solving that for the pan which puts
  // the target square's center exactly at O (dead-center of the viewport):
  const originX = displayPx / 2, originY = displayPx / 2;
  const targetPanX = scale * (originX - cDisplayX);
  const targetPanY = scale * (originY - cDisplayY);

  const start = {tx: viewTransform.panX || 0, ty: viewTransform.panY || 0, scale: viewTransform.scale || 1};
  const end = {tx: targetPanX, ty: targetPanY, scale: scale};

  animateTransform(start, end, 420);
  zoomHint.style.display = 'block';
}
function unzoomSmooth(){ 
  const start = {tx: viewTransform.panX || 0, ty: viewTransform.panY || 0, scale: viewTransform.scale || 1}; 
  const end = {tx: 0, ty:0, scale: 1}; 
  animateTransform(start, end, 420); 
  zoomHint.style.display = 'none'; 
}
function animateTransform(from,to,dur){
  const t0 = performance.now();
  function frame(now){
    const t = Math.min(1,(now - t0)/dur);
    const e = easeInOutCubic(t);
    const tx = from.tx + (to.tx - from.tx)*e;
    const ty = from.ty + (to.ty - from.ty)*e;
    const s = from.scale + (to.scale - from.scale)*e;
    
    // Apply transform
    viewTransform.panX = tx; 
    viewTransform.panY = ty; 
    viewTransform.scale = s;
    canvasWrap.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
    
    // Redraw *during* zoom
    drawBoard();
    redrawOverlay();

    if(t < 1) requestAnimationFrame(frame);
    else {
      // Snap to final state. NOTE: `to` is shaped {tx,ty,scale} (this
      // function's own local naming) while `viewTransform` is shaped
      // {panX,panY,scale} (used everywhere else, e.g. drawBoard()'s
      // ctx.translate(viewTransform.panX, viewTransform.panY)) — assigning
      // `viewTransform = {...to}` here silently corrupted panX/panY to
      // undefined on every completed zoom/unzoom, breaking any redraw that
      // happened afterward without going through another animateTransform
      // call. Set the matching fields explicitly instead.
      viewTransform.panX = to.tx;
      viewTransform.panY = to.ty;
      viewTransform.scale = to.scale;
      canvasWrap.style.transform = `translate(${to.tx}px, ${to.ty}px) scale(${to.scale})`;
      drawBoard();
      redrawOverlay();
    }
  }
  requestAnimationFrame(frame);
}

/* ---------------- EXPORT: CRITICAL FIX ----------------
   This function is now modified to *only* render the moving piece
   on a transparent background.
   THE TYPO 'LOGICAL_GSIZE' IS FIXED.
*/
function exportLastMoveAsWebM(moveRec, opts={fps:EXPORT_FPS}){
  try {
    const fps = opts.fps || EXPORT_FPS;

    // temp canvas for drawing frames — rendered at EXPORT_RENDER_SCALE times
    // LOGICAL_SIZE (physical pixels), independent of the live on-screen
    // board's resolution, so cropping into a tight cinematic frame doesn't
    // upscale an already-low-resolution source (the previous 600x600
    // working canvas, cropped down to e.g. 120x120 for a tight shot and
    // then stretched up to fill a 720x720 export, was exactly that — a
    // ~6x upscale of already-rasterized pixels). All existing drawing code
    // below still works in the same 0..LOGICAL_SIZE coordinate space
    // unchanged; the scale transform on tctx (right below) is what makes it
    // render at higher physical resolution.
    const temp = document.createElement('canvas');
    temp.width = LOGICAL_SIZE * EXPORT_RENDER_SCALE;
    temp.height = LOGICAL_SIZE * EXPORT_RENDER_SCALE;
    const tctx = temp.getContext('2d', {alpha:true});
    tctx.scale(EXPORT_RENDER_SCALE, EXPORT_RENDER_SCALE);

    // export canvas square (with alpha)
    const exportCanvas = document.createElement('canvas'); exportCanvas.width = EXPORT_SIZE; exportCanvas.height = EXPORT_SIZE;
    const ectx = exportCanvas.getContext('2d', {alpha:true});

    // prepare snapshot and moving info — moveRec is now the rich per-ply
    // record built by buildMoveRecord() (see MOVE APPLY section), so the
    // moving piece's *post-move* type/color is known directly (fixes
    // promotion export showing a pawn instead of the promoted piece — this
    // is exactly what live preview already reads via game.get(to)).
    // The piece that TRAVELS vs the piece that ENDS UP on the square. These
    // differ only for a promotion, where the pawn must make the journey on
    // the pawn's own curve and the promoted piece appears on arrival —
    // substituting it in up front made a promoted knight travel in a
    // straight pawn-like line and never move like a knight.
    const travelType = moveRec.pieceType || moveRec.resultPieceType || 'p';
    const landType = moveRec.resultPieceType || travelType;
    const movingColor = moveRec.color || 'w';
    const from = moveRec.from, to = moveRec.to;
    const secondary = moveRec.secondary || null; // castling's rook: {from,to,type:'r',color}
    const extraVacate = moveRec.extraVacate || []; // e.g. en passant's captured-pawn square
    // Move-scoped (Phase 3): only THIS move's own arrows/highlights are
    // exported — never a global list that would leak another move's
    // annotations in. Same fields playRecordAnimation()'s live preview uses.
    const recArrows = moveRec.arrows || [];
    const recHighlights = moveRec.highlights || [];

    // Two static-board snapshots, not one — the captured piece in an en
    // passant capture must stay visible while the capturing pawn is still
    // travelling and disappear only once it lands (see bug report: "the
    // captured pawn is NOT visible during the export"). vacatedSnapshot()
    // (shared with the historical live-preview path) clears the primary
    // piece's origin, castling's rook origin, AND extraVacate (en passant's
    // captured-pawn square, which is not the destination square) AND the
    // destination square itself — correct for the LANDED board, but
    // clearing those from frame one would erase, for the entire clip,
    // pieces the capture has not visually taken yet. During the movement
    // phase only the ORIGIN squares (this piece's `from`, and castling's
    // rook `from`) are cleared, so BOTH an ordinary capture's victim on
    // `to` and en passant's pawn on its own square keep standing right up
    // to the moment of landing, and vanish exactly when the capture
    // visually happens.
    function snapshotClearing(squares){
      const snap = JSON.parse(JSON.stringify(moveRec.preSnapshot || game.board()));
      for(const sqName of squares){
        const f = 'abcdefgh'.indexOf(sqName[0]);
        const r = 8 - parseInt(sqName[1]);
        if(snap[r] && snap[r][f]) snap[r][f] = null;
      }
      return snap;
    }
    const preSnapshotDuringMove = snapshotClearing([from].concat(secondary ? [secondary.from] : []));
    const preSnapshotLanded = vacatedSnapshot(moveRec);

    // compute centers
    const startCenter = squareCenter(from);
    const endCenter = squareCenter(to);
    const secondaryStartCenter = secondary ? squareCenter(secondary.from) : null;
    const secondaryEndCenter = secondary ? squareCenter(secondary.to) : null;

    // ---------------- EXPORT PHASE TIMING (the export contract) ----------
    // The exported clip is an explicit four-phase state machine:
    //
    //   PHASE A  MOVEMENT      elapsed < duration, t = elapsed/duration,
    //                          the piece travels its real pieceTrajectory()
    //   PHASE B  LANDING       the first frame where t>=1 — pieceTrajectory
    //                          is no longer consulted, the piece is pinned to
    //                          its exact destination, a promotion becomes the
    //                          promoted piece, en passant's captured pawn is
    //                          removed. The final chess position is now what
    //                          is on screen.
    //   PHASE C  FINAL HOLD    exactly FINAL_HOLD_MS of that settled state,
    //                          during which the check context (if any) eases
    //                          in and then sits still long enough to read
    //   PHASE D  STOP          frame production and the recorder stop, and
    //                          only here — never on movement time alone
    //
    // Movement is deliberately unhurried: a truncated-looking move is a far
    // worse outcome than a slightly long clip, so the export runs on its own
    // larger base (2000ms floor) rather than the live animation's 1500ms,
    // still scaled by distance through the same shared computeMoveDuration()
    // so a long move gets proportionally more time. Live animation timing is
    // untouched — it keeps calling computeMoveDuration(record) with the
    // default base.
    const EXPORT_MOVEMENT_BASE_MS = 2000;
    const duration = opts.duration || computeMoveDuration(moveRec, EXPORT_MOVEMENT_BASE_MS);

    // -------------------------------------------------
    // --- START FINAL FIX (Padding + Context) ---
    // -------------------------------------------------

    /* ---------------- CAMERA / FRAMING ----------------
       Two things were wrong here and they compounded each other.

       1. The crop was squared with max(boxW, boxH) and clamped only by the
          board itself. A vertical move like Qa1-a8 spans ~7 ranks, so boxH
          reached the full board height and the square crop therefore became
          the ENTIRE board — the reported "A1->A8 shows the whole board".

       2. The camera centre was pinned exactly to the moving piece
          (camX = state.x). A piece drawn dead-centre of the crop in every
          single frame does not appear to move at all: the board slides
          underneath it instead. That is why the knight's arc "did not
          behave as intended" — the arc was being rendered correctly and
          then cancelled out by the camera following it perfectly.

       The fix is to frame the movement rather than chase the piece:

       - The box is sized from the REAL trajectory (pieceTrajectory — the
         same function that draws each frame, so the camera can never frame
         something the renderer didn't draw), capped at MAX_TRAJECTORY_BOX
         so a long move can't escalate to the whole board.
       - If the whole trajectory fits in that box, the camera is STATIC and
         the piece visibly travels across a stationary frame. This is the
         common case and gives the clearest possible origin->path->landing.
       - Only when the trajectory genuinely exceeds the cap does the camera
         move, and then it tracks with a DEAD ZONE: it stays put until the
         piece approaches the edge of frame, so the piece is always moving
         relative to the frame rather than glued to its centre.
       - Arrows/highlights get their own, larger allowance (up to the full
         board): a static annotation can't be revealed by panning, so it
         must fit. This preserves the existing annotation-aware crop.

       DIRECTORIAL RULE (camera/piece decoupling): everything above — the
       trajectory-sized box, the tracking dead zone, all of it — only
       applies once the move has an explicit creator marker: a Story
       Target, or an arrow/highlight annotation. Piece movement by itself
       is never enough; an unmarked move keeps the stable full board no
       matter how far the piece travels. See hasAnnotations/boxSize below.
    */
    const SQ = LOGICAL_SIZE/8;
    const margin = SQ * 0.5;              // "half square" padding (unchanged)
    const MIN_BOX = SQ * 2.8;             // never tighter than ~3 squares of context
    const MAX_TRAJECTORY_BOX = SQ * 5.2;  // beyond this the camera pans instead of zooming out

    const TRAJECTORY_SAMPLES = 24;
    const trajXs = [], trajYs = [];
    function addTrajectorySamples(type, start, end){
      for(let i=0;i<=TRAJECTORY_SAMPLES;i++){
        const st = pieceTrajectory(type, start, end, i/TRAJECTORY_SAMPLES);
        // The piece is drawn centred on (x,y) at PIECE_SCALE, so the box has
        // to contain its drawn extent, not just its centre point.
        const halfPiece = SQ * PIECE_SCALE * st.scale / 2;
        trajXs.push(st.x - halfPiece, st.x + halfPiece);
        trajYs.push(st.y - halfPiece, st.y + halfPiece);
      }
    }
    addTrajectorySamples(travelType, startCenter, endCenter);
    if(secondary){ addTrajectorySamples(secondary.type, secondaryStartCenter, secondaryEndCenter); }

    const trajMinX = Math.min(...trajXs) - margin, trajMaxX = Math.max(...trajXs) + margin;
    const trajMinY = Math.min(...trajYs) - margin, trajMaxY = Math.max(...trajYs) + margin;
    const trajW = trajMaxX - trajMinX, trajH = trajMaxY - trajMinY;

    // Annotations (arrows/highlights) must fit statically — they are never
    // revealed by camera movement. Story Targets join them here: the
    // creator marking a square is the same kind of "this is what matters"
    // signal an arrow or highlight already is, so it widens the frame the
    // same way — and because annXs/annYs are seeded with the trajectory
    // bounds, the resulting box always contains the whole move too.
    const annXs = [trajMinX, trajMaxX], annYs = [trajMinY, trajMaxY];
    for(const h of recHighlights){
      const hc = squareCenter(h.sq);
      annXs.push(hc.x - SQ/2 - margin, hc.x + SQ/2 + margin);
      annYs.push(hc.y - SQ/2 - margin, hc.y + SQ/2 + margin);
    }
    for(const a of recArrows){
      const ac1 = squareCenter(a.from);
      annXs.push(ac1.x - margin, ac1.x + margin); annYs.push(ac1.y - margin, ac1.y + margin);
      const ac2 = a.to ? squareCenter(a.to) : {x:a.toX, y:a.toY};
      if(ac2){ annXs.push(ac2.x - margin, ac2.x + margin); annYs.push(ac2.y - margin, ac2.y + margin); }
    }
    const hasStoryTargets = moveRec.storyTargets.length > 0;
    for(const sq of moveRec.storyTargets){
      const sc = squareCenter(sq);
      annXs.push(sc.x - SQ/2 - margin, sc.x + SQ/2 + margin);
      annYs.push(sc.y - SQ/2 - margin, sc.y + SQ/2 + margin);
    }
    const annW = Math.max(...annXs) - Math.min(...annXs);
    const annH = Math.max(...annYs) - Math.min(...annYs);

    const cap = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    const trajBox = cap(Math.max(trajW, trajH), MIN_BOX, Math.min(MAX_TRAJECTORY_BOX, LOGICAL_SIZE));
    // Only annotations may push the box past the trajectory cap. annXs/annYs
    // are seeded with the trajectory bounds so that an annotation box also
    // contains the move — but when there are no annotations at all that
    // seeding would hand the UNCAPPED trajectory extent straight back and
    // silently undo the cap, which is what still made Qa1-a8 open out to
    // the whole board.
    const hasAnnotations = recHighlights.length > 0 || recArrows.length > 0 || hasStoryTargets;
    const annBox  = hasAnnotations ? cap(Math.max(annW, annH), MIN_BOX, LOGICAL_SIZE) : 0;
    // DIRECTORIAL RULE: piece movement alone must never trigger cinematic
    // camera behaviour. Only an explicit creator marker — a Story Target,
    // or an existing arrow/highlight annotation — does. Without one, the
    // move plays on the stable full board regardless of how far the piece
    // travels; holdBox/holdCamX/holdCamY and the check-context framing
    // below both derive their floor from boxSize, so an ordinary move's
    // post-landing framing (including an incidental check) stays full-board
    // too, with no separate change needed there. With a marker, this is
    // exactly the existing trajectory/annotation-aware framing.
    const boxSize = hasAnnotations ? Math.min(LOGICAL_SIZE, Math.max(trajBox, annBox)) : LOGICAL_SIZE;

    // Centre of the whole framed event (trajectory + annotations).
    const eventCX = (Math.min(...annXs) + Math.max(...annXs))/2;
    const eventCY = (Math.min(...annYs) + Math.max(...annYs))/2;

    // Camera path, decided per axis and evaluated from the piece's own eased
    // progress so camera and piece can never disagree about where we are in
    // the move.
    //
    //  - Axis fits in the frame  -> the camera does not move on that axis.
    //    The piece travels across a still frame, which is the clearest way
    //    to read origin -> path -> landing, and covers every short/medium
    //    move plus anything an annotation widened.
    //  - Axis does not fit       -> a tracking shot. The camera leads the
    //    piece at the start and trails it at the end by `inset`, so the
    //    piece sweeps from one side of the frame to the other while the
    //    camera covers LESS ground than the piece does. That is what keeps
    //    the movement visible: a camera that travels exactly as far as the
    //    piece (or worse, sits on it) renders the piece motionless.
    const INSET_FRACTION = 0.30;   // piece rests 30% off-centre at each end
    function cameraPathForAxis(p0, p1, extent, staticCentre){
      if(extent <= boxSize + 0.5) return [staticCentre, staticCentre];
      const dir = Math.sign(p1 - p0) || 1;
      const inset = Math.min(boxSize * INSET_FRACTION, Math.abs(p1 - p0)/2);
      return [p0 + inset*dir, p1 - inset*dir];
    }
    // Castling moves two pieces, so the camera follows their midpoint.
    const focusStart = secondary
      ? {x:(startCenter.x + secondaryStartCenter.x)/2, y:(startCenter.y + secondaryStartCenter.y)/2}
      : startCenter;
    const focusEnd = secondary
      ? {x:(endCenter.x + secondaryEndCenter.x)/2, y:(endCenter.y + secondaryEndCenter.y)/2}
      : endCenter;
    const [camX0, camX1] = cameraPathForAxis(focusStart.x, focusEnd.x, trajW, eventCX);
    const [camY0, camY1] = cameraPathForAxis(focusStart.y, focusEnd.y, trajH, eventCY);

    // ---- End-of-move framing (check context) ----
    // A checking move is a two-beat event: the piece completes its journey,
    // then the frame settles to make the resulting check readable. During
    // the hold the camera/box ease toward a framing that contains both the
    // landing square and the king that is now in check. No effects are
    // added — this is framing only.
    const checkSq = moveRec.checkSquare ? squareCenter(moveRec.checkSquare) : null;
    let holdBox = boxSize, holdCamX = camX1, holdCamY = camY1;
    if(checkSq){
      // The framing that contains BOTH the landing square and the checked
      // king. boxSize acts purely as a FLOOR (with MIN_BOX), so this beat
      // widens or holds and never tightens back in on the movement framing;
      // the board is the only ceiling, so a distant king still fits.
      const f = framingForCentres([endCenter, checkSq], Math.max(MIN_BOX, boxSize));
      holdBox = f.box; holdCamX = f.camX; holdCamY = f.camY;
    }

    // ---- Consequence framing (human Story Targets) ----
    // The creator marks the squares that make this move matter. The camera
    // frames the destination TOGETHER with them, so the payoff stays anchored
    // to the piece that caused it. Nothing is inferred: with no targets there
    // is no consequence beat at all and the camera behaves exactly as before.
    const storyCentres = moveRec.storyTargets.map(sq => squareCenter(sq));
    const storyFraming = storyCentres.length
      ? framingForCentres([endCenter].concat(storyCentres), MIN_BOX)
      : null;
    // PHASE C. Every exported move ends on the same beat: exactly one second
    // of the finished, fully landed position. Previously this was a
    // check-dependent 850/260ms that the export ALSO used as its stop
    // condition, so the camera finished easing into the check framing on the
    // very frame the recorder was told to stop — the settled check context
    // existed for about one frame and was effectively never seen. The hold
    // is now a fixed, deliberately generous beat that is timed from the
    // LANDING FRAME (not from movement time) and must actually be rendered
    // before the export may stop; the check framing eases in over its first
    // part so the rest is a still, readable final state.
    const FINAL_HOLD_MS = 1000;
    // Fraction of the hold spent easing the camera into the check context.
    // The remainder (~55%) is held completely static, which is what makes
    // the final state readable rather than merely reached.
    const HOLD_SETTLE_FRACTION = 0.45;

    // --- CONTEXT FIX: These functions are now restored ---
    // These functions are helpers *inside* exportLastMoveAsWebM
    function drawPiecesFromSnapshotTo(targetCtx, snapshot){
      const s = LOGICAL_SIZE/8;
      for(let r=0;r<8;r++){
        for(let f=0;f<8;f++){
          const p = snapshot[r][f];
          if(!p) continue;
          const sq = 'abcdefgh'[f] + (8 - r);
          const visFile = boardFlipped ? (7 - f) : f;
          const visRank = boardFlipped ? (7 - r) : r;
          const cx = visFile*s + s/2, cy = visRank*s + s/2;
          const img = (pieceImages[p.color] && pieceImages[p.color][p.type]) ? pieceImages[p.color][p.type] : null;
          if(img && img.complete){
            const w = s * PIECE_SCALE, h = s * PIECE_SCALE;
            targetCtx.drawImage(img, cx - w/2, cy - h/2, w, h);
          } else {
            targetCtx.save();
            targetCtx.font = Math.floor(s*PIECE_SCALE) + 'px serif';
            targetCtx.textAlign='center'; targetCtx.textBaseline='middle';
            targetCtx.fillStyle = (p.color==='w' ? '#fff' : '#0f0f0f');
            targetCtx.fillText(glyphFor(p.type,p.color), cx, cy);
            targetCtx.restore();
          }
        }
      }
    }

    function drawOverlayElementsToTemp(targetCtx, landed){
      if(!landed) return;
      const s = LOGICAL_SIZE/8;
      for(const h of recHighlights){
        const vf = boardFlipped ? (7 - h.file) : h.file;
        const vr = boardFlipped ? (7 - h.rank) : h.rank;
        drawHighlightAt(targetCtx, vf*s, vr*s, s, h.color);
      }
      for(const a of recArrows){
        const from = squareCenter(a.from);
        const to = a.to ? squareCenter(a.to) : {x:a.toX, y:a.toY};
        drawArrow(targetCtx, from, to, a.color);
      }
      // Badge (Phase 5): same shared drawBadgeAt() live preview uses, so it
      // looks identical in export — see redrawOverlay().
      if(moveRec.badge){
        drawBadgeAt(targetCtx, moveRec.to, moveRec.badge);
      }
    }

    function drawBoardToTemp(landed){
      tctx.clearRect(0,0,LOGICAL_SIZE,LOGICAL_SIZE);
      const s = LOGICAL_SIZE/8;
      // draw squares
      for(let r=0;r<8;r++){
        for(let f=0;f<8;f++){
          const x = f*s, y = r*s;
          const isDark = ((r+f)%2===1);
          paintSquare(tctx, x, y, s, isDark);
        }
      }
      // draw pieces from snapshot (without moving piece). Before landing,
      // en passant's captured pawn is still on its original square; once
      // landed it's cleared along with the mover's own origin square(s).
      drawPiecesFromSnapshotTo(tctx, landed ? preSnapshotLanded : preSnapshotDuringMove);
      // draw arrows & highlights
      drawOverlayElementsToTemp(tctx, landed);
    }

    // -------------------------------------------------
    // --- END FINAL FIX (Padding + Context) ---
    // -------------------------------------------------

    // Draws one moving piece (image, or glyph fallback) onto the temp
    // canvas at the given computed state. Factored out so castling can call
    // it twice per frame (king + rook) without duplicating this block.
    function drawMovingPieceToTemp(color, type, state){
      if(pieceImages[color] && pieceImages[color][type] && pieceImages[color][type].complete){
        const img = pieceImages[color][type];
        const s = LOGICAL_SIZE/8;
        const w = s * PIECE_SCALE * state.scale, h = s * PIECE_SCALE * state.scale;
        tctx.save();
        tctx.translate(state.x, state.y);
        tctx.rotate(state.angle);
        tctx.drawImage(img, -w/2, -h/2, w, h);
        tctx.restore();
      } else {
        // (Original glyph fallback)
        tctx.save();
        tctx.font = Math.floor((LOGICAL_SIZE/8)*PIECE_SCALE) + 'px serif';
        tctx.textAlign='center'; tctx.textBaseline='middle';
        tctx.fillStyle = (color==='w' ? '#fff' : '#000');
        tctx.fillText(glyphFor(type,color), state.x, state.y);
        tctx.restore();
      }
    }

    // ---------------- EXPORT TIMING (Phase 4) ----------------
    // Previously: captureStream(fps) (an internal fixed-rate auto-sampler
    // that grabs whatever is currently on the canvas on its own clock) fed
    // by setInterval(fn, intervalMs) with a naive frameIndex++ counter that
    // assumed every tick landed exactly intervalMs apart. Under any main-
    // thread jank, setInterval ticks can fire late or get coalesced, which
    // both (a) desyncs frameIndex-based `t` from real elapsed time and
    // (b) lets the auto-sampler capture a stale/duplicate frame if a tick
    // fires late.
    //
    // Fix: use captureStream(0) — the standard "manual" capture mode where
    // NO frame is captured automatically; we push each one explicitly via
    // CanvasCaptureMediaStreamTrack.requestFrame() the instant it's drawn,
    // so every captured frame is guaranteed fresh, never stale/duplicated.
    // Pacing comes from requestAnimationFrame with `t` computed from actual
    // elapsed wall-clock time (performance.now()) — exactly the same
    // pattern the live animation curves (animPawn/animRook/etc.) already
    // use — instead of assuming uniform timer ticks. This is standard,
    // well-supported Chrome API surface (no invented/manual frame-
    // injection mechanism); MediaRecorder is still an inherently real-time
    // recorder, so a ~duration-long export still takes ~duration of wall
    // time to produce — that's a property of MediaRecorder itself, not
    // something a different timing mechanism can avoid.
    //
    // Feature-detected: if requestFrame() isn't available (very old
    // Chrome), falls back to the previous fixed-rate auto-sampling so
    // export still works, just without the stale-frame guarantee.
    let stream = null, track = null, canRequestFrame = false;
    try {
      const probe = exportCanvas.captureStream(0);
      const probeTrack = probe.getVideoTracks()[0];
      if(probeTrack && typeof probeTrack.requestFrame === 'function'){
        stream = probe; track = probeTrack; canRequestFrame = true;
      }
    } catch(e){ /* fall through to auto-rate capture below */ }
    if(!stream){ stream = exportCanvas.captureStream(fps); }

    // prepare MediaRecorder with alpha if supported. An explicit
    // videoBitsPerSecond is required here — without it Chrome's own default
    // bitrate heuristic for a captureStream() source is conservative and
    // visibly soft even at 1080p, which was the other half of the reported
    // "360p/480p-looking" quality problem (resolution alone isn't enough;
    // a high-res frame encoded at a low bitrate still looks blurry). 12Mbps
    // is a generous "editing source" target for a ~1080x1080 clip a few
    // seconds long (a few MB per export) — this is meant to be re-compressed
    // by the user's editor and then YouTube, not a final delivery file.
    const EXPORT_BITRATE = 12_000_000;
    let mime = 'video/webm;codecs=vp9';
    let recorder;
    try { recorder = new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: EXPORT_BITRATE}); }
    catch(e){
      console.warn("VP9 with alpha not supported, falling back.");
      mime = 'video/webm';
      try {
        recorder = new MediaRecorder(stream, {mimeType: mime, videoBitsPerSecond: EXPORT_BITRATE});
      } catch (e2) {
        showMessage("Video recording is not supported on this browser.", "error");
        return;
      }
    }
    const chunks = [];
    recorder.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(chunks, {type: mime});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const fromName = from.replace(/\s+/g,'');
      const toName = to.replace(/\s+/g,'');
      a.href = url;
      a.download = `move_${fromName}_to_${toName}.webm`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>{ URL.revokeObjectURL(url); }, 2000);

      showMessage('Export complete!', 'success');
    };

    // Start recorder
    recorder.start();
    showMessage('Recording... Please wait.', 'success', duration + FINAL_HOLD_MS + 500);

    // Produce frames: one rendered+pushed frame per requestAnimationFrame
    // tick that clears the ~fps pacing gate, so file size/frame rate stay
    // close to the requested target on high-refresh-rate displays.
    const minFrameIntervalMs = 1000 / fps;
    // ---------------- DETERMINISTIC FRAME SCHEDULE ----------------
    // The clip is defined as an exact NUMBER OF FRAMES, not as a wall-clock
    // window.
    //
    // Every previous version computed t (and the hold/settle progress) from
    // performance.now(), while frames were only produced when
    // requestAnimationFrame happened to fire. Those are two different things:
    // the animation advanced on the wall clock whether or not a frame was
    // produced, so whatever span the browser stalled through was simply never
    // encoded. That made completeness a function of machine speed and
    // background load rather than of the code — the same move exported
    // correctly on a quiet moment and truncated on a busy one. Measured with
    // 383ms rAF gaps: a move jumped 15-20% of its trajectory between
    // consecutive encoded frames, the settle went 0 -> 1 in a single step,
    // and the hold collapsed from ~21 frames to 5.
    //
    // Now frameIndex is the only thing that advances the animation, and it
    // advances by exactly one per PUSHED frame. The same move therefore
    // always encodes the same frames in the same order. A stalled or slow
    // browser makes the clip take longer and play back slower; it can no
    // longer make it incomplete.
    const MOVEMENT_FRAMES = Math.max(2, Math.round((duration / 1000) * fps));
    const HOLD_FRAMES     = Math.max(2, Math.round((FINAL_HOLD_MS / 1000) * fps));
    // The captured piece's destruction beat is CARVED OUT of the front of
    // the hold that already exists — it never adds frames. MOVEMENT_FRAMES,
    // HOLD_FRAMES, SETTLE_FRAMES, TOTAL_HOLD_FRAMES and the termination test
    // below are all untouched, so turning an effect on cannot change how
    // long the clip is. Read once here, not per frame, so a clip is rendered
    // with one consistent effect.
    const fxKind   = captureEffect;
    const fxVictim = captureVictim(moveRec);
    const fxSeed   = fxVictim ? fxSeedFor(moveRec, fxVictim.sq) : 0;
    const fxDir    = captureDriftDir(moveRec);
    const FX_FRAMES = Math.max(1, Math.min(CAPTURE_FX_FRAMES, HOLD_FRAMES - 1));
    // Frames of the hold spent easing into the check context; the rest are
    // fully settled. Both are frame counts now, so the check context is
    // guaranteed to be encoded across real frames instead of whatever
    // happened to fall inside a wall-clock window.
    const SETTLE_FRAMES   = Math.max(1, Math.round(HOLD_FRAMES * HOLD_SETTLE_FRACTION));

    // ---------------- CAMERA STAGES AFTER LANDING ----------------
    // A move can have more than one thing worth showing. The hold is an
    // ordered list of framings; each stage eases from the previous framing
    // over `ease` frames and then holds still for `hold` frames, all counted
    // in schedule frames so the sequence is as deterministic as the movement.
    //
    //   stage 1  IMPACT       what just happened where it landed — the check
    //                         relationship when there is one, otherwise the
    //                         movement framing held still. This is exactly the
    //                         previous single-stage behaviour.
    //   stage 2  CONSEQUENCE  only when the creator marked Story Targets: the
    //                         camera reframes to the destination plus those
    //                         squares and holds long enough to read them.
    //
    // With no Story Targets the list has exactly one stage whose ease/hold are
    // the previous SETTLE_FRAMES / HOLD_FRAMES-SETTLE_FRAMES, so a move
    // without them is frame-for-frame identical to before.
    const STORY_EASE_FRAMES = Math.max(1, Math.round(0.45 * fps));
    const STORY_HOLD_FRAMES = Math.max(2, Math.round(1.0 * fps));
    const cameraStages = [
      { box: holdBox, camX: holdCamX, camY: holdCamY,
        ease: SETTLE_FRAMES, hold: HOLD_FRAMES - SETTLE_FRAMES }
    ];
    if(storyFraming){
      cameraStages.push({ box: storyFraming.box, camX: storyFraming.camX, camY: storyFraming.camY,
                          ease: STORY_EASE_FRAMES, hold: STORY_HOLD_FRAMES });
    }
    const TOTAL_HOLD_FRAMES = cameraStages.reduce((n, st) => n + st.ease + st.hold, 0);

    // The framing at a given hold frame: walk the stages, easing between each
    // stage's framing and the one before it. Hold frame 0 is the landing
    // frame, which always sits on the movement framing — so no consequence or
    // check framing can ever begin before the piece is rendered settled.
    function framingAtHold(holdIdx, fromBox, fromCamX, fromCamY){
      let box = fromBox, cx = fromCamX, cy = fromCamY, k = holdIdx;
      for(const st of cameraStages){
        if(k <= st.ease){
          const e = easeInOutCubic(k / st.ease);
          return { box: box + (st.box - box)*e, camX: cx + (st.camX - cx)*e, camY: cy + (st.camY - cy)*e };
        }
        k -= st.ease;
        if(k <= st.hold) return { box: st.box, camX: st.camX, camY: st.camY };
        k -= st.hold;
        box = st.box; cx = st.camX; cy = st.camY;
      }
      return { box, camX: cx, camY: cy };
    }

    let frameIndex = 0;   // 0..MOVEMENT_FRAMES-1 movement, ==MOVEMENT_FRAMES landing, beyond it hold
    let lastPushedAt = -Infinity;
    let finished = false;

    function frameStep(now){
      if(finished) return;
      // Pace to ~fps against the wall clock so a healthy machine still
      // produces a real-time-length clip — but this only ever DELAYS the next
      // frame, it never skips a schedule step. Frame content is a function of
      // frameIndex alone.
      if(now - lastPushedAt < minFrameIntervalMs){ requestAnimationFrame(frameStep); return; }

      // -------------------------------------------------
      // --- START RENDER LOOP (with Context) ---
      // -------------------------------------------------

      // PHASE A while frameIndex<MOVEMENT_FRAMES; PHASE B exactly at
      // MOVEMENT_FRAMES (the landing frame, holdIndex 0); PHASE C after.
      const t = Math.min(1, frameIndex / MOVEMENT_FRAMES);
      const landed = frameIndex >= MOVEMENT_FRAMES;
      const holdIndex = landed ? (frameIndex - MOVEMENT_FRAMES) : -1;
      // Hold progress, counted in FRAMES from the landing frame. The landing
      // frame itself is holdIndex 0, so no end framing can begin before the
      // piece has been rendered settled on its destination.
      const h = landed ? Math.min(1, holdIndex / TOTAL_HOLD_FRAMES) : 0;

      // 1. Draw the board, static pieces, and overlays
      drawBoardToTemp(landed);

      // 2. Compute moving piece state at t, and the secondary (rook) piece's
      //    state too when castling — same pieceTrajectory() the live
      //    animation and the camera framing use.
      //
      //    Once landed (t>=1), the state is pinned to the exact resting
      //    pose instead of calling pieceTrajectory() again at t=1. Several
      //    of its per-type curves carry a flourish that never fully
      //    resolves at t=1 — e.g. the default/pawn curve's hop
      //    (`-6*bob`) is still -3px at t=1, and the king's own curve
      //    deliberately eases to t*0.9 and never reaches 1 — so re-querying
      //    pieceTrajectory(...,1) every hold-phase frame kept rendering the
      //    piece a few pixels off its square for the entire settle/check
      //    beat, which reads as "still in transit" right when the check
      //    context is supposed to be taking over. The live preview never
      //    has this problem because it simply stops drawing the animated
      //    piece once its own loop finishes (see animPiece); this makes
      //    export match that already-correct behaviour instead of changing
      //    any in-flight curve.
      const state = landed
        ? {x: endCenter.x, y: endCenter.y, angle: 0, scale: 1, e: 1}
        : pieceTrajectory(travelType, startCenter, endCenter, t);
      let secondaryState = null;
      if(secondary){
        secondaryState = landed
          ? {x: secondaryEndCenter.x, y: secondaryEndCenter.y, angle: 0, scale: 1, e: 1}
          : pieceTrajectory(secondary.type, secondaryStartCenter, secondaryEndCenter, t);
      }

      // 2b. The captured piece's destruction beat, drawn on the static board
      //     but UNDER the arriving piece, so the capture still reads as one
      //     piece taking another. Driven by holdIndex alone: at holdIndex 0
      //     the victim is still whole, and once the beat is over it is gone
      //     for the entire remainder of the hold.
      if(landed && fxVictim && fxKind !== 'off'){
        drawCaptureEffect(tctx, fxKind, fxVictim, holdIndex / FX_FRAMES, fxSeed, fxDir);
      }

      // 3. Draw the moving piece(s) on top of the context. A promotion only
      //    becomes the promoted piece once the pawn has actually arrived.
      const drawnType = landed ? landType : travelType;
      drawMovingPieceToTemp(movingColor, drawnType, state);
      if(secondary){
        drawMovingPieceToTemp(secondary.color, secondary.type, secondaryState);
      }

      // -------------------------------------------------
      // --- END RENDER LOOP ---
      // -------------------------------------------------

      // 4. Advance the camera. NOT pinned to the piece: a piece held at the
      //    exact centre of every frame reads as motionless while the board
      //    slides past it, which is what made the movement (the knight's arc
      //    especially) look like it wasn't happening. When the whole
      //    trajectory fits the frame the camera simply doesn't move and the
      //    piece travels across a static shot. Otherwise it tracks with a
      //    dead zone, so it only gives ground once the piece nears the edge
      //    and the piece still moves relative to the frame.
      // The camera advances on the SAME eased progress the piece uses, so
      // the two never disagree — but over a shorter distance, which is what
      // makes the piece visibly travel across the frame.
      const prog = state.e;
      const camX = camX0 + (camX1 - camX0) * prog;
      const camY = camY0 + (camY1 - camY0) * prog;

      // While the piece is travelling the camera is the movement camera. Once
      // landed, walk the camera stages (impact, then the consequence beat when
      // the creator marked Story Targets). Each stage eases in and is then
      // HELD still, so a framing never arrives just as the recorder stops.
      const framing = landed
        ? framingAtHold(holdIndex, boxSize, camX, camY)
        : { box: boxSize, camX, camY };
      const frameBox = framing.box, frameCamX = framing.camX, frameCamY = framing.camY;

      // Compute crop (ensure crop fits inside board)
      const half = frameBox / 2;
      let sx = Math.max(0, Math.min(LOGICAL_SIZE - frameBox, frameCamX - half));
      let sy = Math.max(0, Math.min(LOGICAL_SIZE - frameBox, frameCamY - half));

      // 5. Draw cropped region from temp (transparent) canvas to final
      //    (export) canvas. sx/sy/boxSize are in the 0..LOGICAL_SIZE
      //    logical space; temp's PHYSICAL pixels are EXPORT_RENDER_SCALE
      //    times larger (see temp.width/height above), so the source rect
      //    passed to drawImage must be scaled up to match — drawImage's
      //    9-argument form reads the source rectangle in the source
      //    canvas's actual physical pixels, not through its transform.
      ectx.clearRect(0,0,EXPORT_SIZE,EXPORT_SIZE);
      ectx.drawImage(
        temp,
        sx*EXPORT_RENDER_SCALE, sy*EXPORT_RENDER_SCALE, frameBox*EXPORT_RENDER_SCALE, frameBox*EXPORT_RENDER_SCALE,
        0, 0, EXPORT_SIZE, EXPORT_SIZE
      );

      // 6. Push exactly this frame into the capture stream. Every frame the
      //    schedule defines is pushed — there is no throttle decision here
      //    any more, because the pacing above already decided that this tick
      //    produces a frame. The schedule advances only on a pushed frame, so
      //    a frame can never be skipped, including the landing frame.
      //    (In the auto-rate fallback the browser samples the canvas on its
      //    own clock; the schedule still advances identically, which is what
      //    lets the loop terminate in that mode at all — the previous
      //    termination test counted manually-pushed frames, so with
      //    requestFrame unavailable it could never be satisfied and the loop
      //    ran forever without ever stopping the recorder.)
      if(canRequestFrame) track.requestFrame();
      lastPushedAt = now;
      frameIndex++;

      // PHASE D. Stop only once the landing frame AND every hold frame have
      // actually been rendered and pushed. Termination is now a pure function
      // of frames emitted: no elapsed-time test can end the export early, and
      // no camera or encoder timing participates in the decision.
      if(holdIndex < TOTAL_HOLD_FRAMES){
        requestAnimationFrame(frameStep);
      } else {
        finished = true;
        // Let the last pushed frames reach the encoder before stopping. The
        // hold deliberately ends on several identical settled frames, so even
        // if the encoder drops the very last one the settled state is still
        // present in the file.
        setTimeout(()=>{ recorder.stop(); }, Math.max(120, minFrameIntervalMs * 3));
      }
    }
    requestAnimationFrame(frameStep);
  } catch (err) {
    console.error("Export failed:", err);
    showMessage("Export failed! See console for error.", "error");
  }
}

/* ---------------- INIT ---------------- */
window.addEventListener('load', ()=>{ try{ readyInit(); } catch(e){ console.error(e); readyInit(); } });

/* ---------------- NEW: UI Util Functions ---------------- */
function updateStatus() {
  if (!game) return;
  let status = game.turn() === 'w' ? "White's Turn" : "Black's Turn";
  
  if (game.in_checkmate()) {
      status = `Checkmate! ${game.turn() === 'w' ? 'Black' : 'White'} wins.`;
  } else if (game.in_stalemate()) {
      status = 'Stalemate! Game is a draw.';
  } else if (game.in_draw()) {
      status = 'Draw!';
  } else if (game.in_check()) {
      status += ' (Check)';
  }
  
  statusBar.textContent = status;
  statusBar.style.color = game.in_check() ? '#F44336' : 'white';
  statusBar.style.display = 'block';
}

function showMessage(message, type = 'success', duration = 3000) {
    messageBox.textContent = message;
    messageBox.className = type === 'error' ? 'error' : 'success';
    messageBox.classList.add('show');
    
    setTimeout(() => {
        messageBox.classList.remove('show');
    }, duration);
}

/* ---------------- UTIL (Original) ---------------- */
function hexToRgba(hex,a=1){ 
    const c = hex.replace('#',''); 
    const bigint = parseInt(c,16); 
    const r=(bigint>>16)&255; 
    const g=(bigint>>8)&255; 
    const b=bigint&255; 
    return `rgba(${r},${g},${b},${a})`; 
}
window.addEventListener('resize', debounce(()=>{ sizeBoardExplicit(); }, 120));
function debounce(fn, wait){ let t; return function(){ clearTimeout(t); t = setTimeout(fn, wait); }; }
